<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>e-Simpel sedang tidak bisa diakses</title>
<style>
  :root {
    --bg1: #eef4ff; --bg2: #f8fbff;
    --card: #ffffff; --ink: #15233b; --muted: #5b6b85;
    --brand: #2563eb; --brand-ink: #ffffff; --accent: #f59e0b;
    --line: #e1e8f5; --shadow: 0 20px 50px rgba(37, 99, 235, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #0c1424; --bg2: #101a2f;
      --card: #16223a; --ink: #eaf0fb; --muted: #9fb0cc;
      --brand: #5b8def; --brand-ink: #0b1220; --accent: #fbbf24;
      --line: #25345a; --shadow: 0 20px 50px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 600px at 20% -10%, var(--bg1), transparent 60%), var(--bg2);
    display: grid; place-items: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 36px 28px 28px;
    text-align: center;
  }
  .art { width: 260px; max-width: 80%; height: auto; margin: 0 auto 8px; display: block; overflow: visible; }
  .arm { transform-origin: 104px 112px; animation: hammer 1.6s ease-in-out infinite; }
  .tail { transform-origin: 54px 140px; animation: wag 2.2s ease-in-out infinite; }
  .server { animation: shake 1.6s ease-in-out infinite; }
  .hit { opacity: 0; transform-origin: 148px 108px; animation: hit 1.6s ease-out infinite; }
  .blink { transform-origin: 80px 90px; animation: blinkeye 4s infinite; }
  .led { animation: led 1.1s steps(2, jump-none) infinite; }
  .led.l2 { animation-delay: .35s; }
  .led.l3 { animation-delay: .7s; }
  .zz { opacity: 0; animation: zz 3.2s ease-in-out infinite; }
  .zz.z2 { animation-delay: 1.1s; }
  @keyframes hammer {
    0% { transform: rotate(-25deg); }
    45% { transform: rotate(-25deg); }
    60% { transform: rotate(55deg); }
    70% { transform: rotate(48deg); }
    100% { transform: rotate(-25deg); }
  }
  @keyframes shake { 0%,58%,100% { transform: translateX(0); } 62% { transform: translateX(3px); } 68% { transform: translateX(-1.5px); } 74% { transform: translateX(0); } }
  @keyframes hit { 0%,58% { opacity: 0; transform: scale(.4); } 62% { opacity: 1; transform: scale(1.1); } 80%,100% { opacity: 0; transform: scale(1.4); } }
  @keyframes wag { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
  @keyframes blinkeye { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes led { 0% { opacity: 1; } 100% { opacity: .25; } }
  @keyframes zz { 0% { opacity: 0; transform: translate(0,6px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translate(6px,-12px); } }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; letter-spacing: .02em;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    padding: 6px 12px; border-radius: 999px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 { font-size: clamp(22px, 5.5vw, 28px); line-height: 1.25; margin: 16px 0 10px; }
  p { margin: 0 0 10px; color: var(--muted); line-height: 1.6; font-size: 16px; }
  p.strong { color: var(--ink); font-weight: 600; }
  .actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  button {
    appearance: none; border: 0; cursor: pointer;
    background: var(--brand); color: var(--brand-ink);
    font: inherit; font-weight: 600;
    padding: 12px 22px; border-radius: 12px; min-width: 180px;
    transition: transform .15s ease, opacity .15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .6; cursor: default; transform: none; }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 40%, transparent); outline-offset: 2px; }
  .hint { font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="card" role="main">
  <svg class="art" viewBox="0 0 240 180" role="img" aria-label="Kucing berhelm proyek sedang memperbaiki server dengan palu">
    <ellipse cx="120" cy="168" rx="104" ry="7" fill="currentColor" opacity=".08"/>

    <!-- server yang sedang diperbaiki -->
    <g class="server">
      <rect x="152" y="94" width="58" height="68" rx="9" fill="#64748b"/>
      <rect x="152" y="94" width="58" height="14" rx="9" fill="#78879c"/>
      <rect x="160" y="116" width="42" height="8" rx="4" fill="#475569"/>
      <rect x="160" y="130" width="42" height="8" rx="4" fill="#475569"/>
      <circle class="led" cx="168" cy="101" r="2.6" fill="#ef4444"/>
      <circle class="led l2" cx="177" cy="101" r="2.6" fill="#f59e0b"/>
      <circle class="led l3" cx="186" cy="101" r="2.6" fill="#22c55e"/>
      <g transform="rotate(-18 190 146)">
        <rect x="174" y="141" width="32" height="10" rx="4" fill="#fcd9a8"/>
        <circle cx="182" cy="146" r="1.2" fill="#e0b27a"/><circle cx="190" cy="146" r="1.2" fill="#e0b27a"/><circle cx="198" cy="146" r="1.2" fill="#e0b27a"/>
      </g>
    </g>

    <!-- bunga api saat palu mengenai -->
    <g class="hit" fill="#fbbf24">
      <path d="M148 98l3 7 7-3-4 6 7 3-8 1 1 8-6-6-5 6 0-8-8-1 7-3-4-6 7 3z"/>
    </g>

    <!-- kucing -->
    <path class="tail" d="M54 140 q-30 0 -28 -30" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="80" cy="128" rx="30" ry="32" fill="#f59e0b"/>
    <ellipse cx="80" cy="134" rx="17" ry="22" fill="#fde7bd"/>
    <ellipse cx="68" cy="160" rx="11" ry="6" fill="#fde7bd"/>
    <ellipse cx="94" cy="160" rx="11" ry="6" fill="#fde7bd"/>
    <path d="M56 72 L54 48 L74 62 Z" fill="#f59e0b"/>
    <path d="M104 72 L106 48 L86 62 Z" fill="#f59e0b"/>
    <path d="M58 66 L58 54 L68 62 Z" fill="#f9a8a8"/>
    <path d="M102 66 L102 54 L92 62 Z" fill="#f9a8a8"/>
    <circle cx="80" cy="86" r="27" fill="#f59e0b"/>
    <path d="M70 62 q-2 8 2 12 M80 59 v13 M90 62 q2 8 -2 12" stroke="#d97706" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g class="blink">
      <circle cx="69" cy="90" r="3.6" fill="#15233b"/><circle cx="91" cy="90" r="3.6" fill="#15233b"/>
      <circle cx="70.2" cy="88.8" r="1.1" fill="#fff"/><circle cx="92.2" cy="88.8" r="1.1" fill="#fff"/>
    </g>
    <ellipse cx="62" cy="99" rx="5" ry="3" fill="#f9a8a8" opacity=".7"/>
    <ellipse cx="98" cy="99" rx="5" ry="3" fill="#f9a8a8" opacity=".7"/>
    <path d="M77 96 h6 l-3 4 z" fill="#ec6b8a"/>
    <path d="M80 100 q-4 5 -8 1 M80 100 q4 5 8 1" stroke="#15233b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M52 94 l-12 -2 M52 99 l-12 3 M108 94 l12 -2 M108 99 l12 3" stroke="#15233b" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>

    <!-- helm proyek -->
    <path d="M55 74 a25 22 0 0 1 50 0 z" fill="#facc15"/>
    <rect x="50" y="72" width="60" height="7" rx="3.5" fill="#eab308"/>
    <rect x="76" y="52" width="8" height="21" rx="3" fill="#eab308"/>

    <!-- lengan + palu -->
    <g class="arm">
      <rect x="120" y="82" width="5" height="32" rx="2.5" fill="#92400e"/>
      <rect x="111" y="74" width="24" height="13" rx="3.5" fill="#94a3b8"/>
      <rect x="111" y="74" width="24" height="4" rx="2" fill="#cbd5e1"/>
      <ellipse cx="114" cy="112" rx="14" ry="7.5" fill="#f59e0b"/>
      <circle cx="122" cy="112" r="6" fill="#fde7bd"/>
    </g>

    <!-- zZ kecil (kucing capek tapi semangat) -->
    <text class="zz" x="108" y="48" font-size="12" font-weight="700" fill="#2563eb">z</text>
    <text class="zz z2" x="118" y="38" font-size="9" font-weight="700" fill="#2563eb">z</text>
  </svg>

  <span class="pill"><span class="dot"></span>Sedang dalam perbaikan</span>
  <h1>Maaf ya, e-Simpel sedang tidak bisa diakses</h1>
  <p>Pasti kamu kesal ya, tidak bisa membukanya padahal sedang butuh.</p>
  <p class="strong">Sabar ya, tim kami sedang memperbaikinya.</p>
  <p>Mohon bersabar. Kami akan segera kembali.</p>

  <div class="actions">
    <button id="retry" type="button">Coba lagi</button>
    <div class="hint" id="hint" aria-live="polite"></div>
  </div>

  <div class="foot">Halaman ini akan terbuka sendiri begitu e-Simpel kembali normal.</div>
</main>

<script>
(function () {
  var INTERVAL = 30;
  var left = INTERVAL, busy = false;
  var btn = document.getElementById('retry');
  var hint = document.getElementById('hint');

  function render() {
    hint.textContent = busy ? 'Memeriksa…' : 'Memeriksa ulang otomatis dalam ' + left + ' detik';
  }

  function check() {
    if (busy) return;
    busy = true; btn.disabled = true; render();
    fetch(location.pathname + '?cek=' + Date.now(), {
      cache: 'no-store',
      headers: { 'Accept': 'text/html' }
    }).then(function (res) {
      // Halaman ini dikirim dengan status 503. Selain itu berarti web sudah pulih.
      if (res.ok) { location.reload(); return; }
      done('Belum bisa dibuka. Kami coba lagi nanti.');
    }).catch(function () {
      done('Belum bisa dibuka. Kami coba lagi nanti.');
    });
  }

  function done(msg) {
    busy = false; btn.disabled = false; left = INTERVAL;
    hint.textContent = msg;
    setTimeout(render, 2500);
  }

  btn.addEventListener('click', check);
  setInterval(function () {
    if (busy) return;
    left -= 1;
    if (left <= 0) { check(); } else { render(); }
  }, 1000);
  render();
})();
</script>
</body>
</html>
